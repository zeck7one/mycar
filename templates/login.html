<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Meu Carro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Barlow+Condensed:wght@700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0f0f13;
    color: #e8e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box {
    background: #1a1a22;
    border: 1px solid #2e2e3e;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .icon { font-size: 3rem; margin-bottom: 12px; }
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: #f97316;
    margin-bottom: 6px;
  }
  .sub { color: #7a7a9a; font-size: 0.85rem; margin-bottom: 28px; }
  label { display: block; text-align: left; font-size: 0.8rem; font-weight: 600; color: #7a7a9a; margin-bottom: 6px; }
  input[type=password] {
    width: 100%;
    padding: 12px 14px;
    background: #22222e;
    border: 1px solid #2e2e3e;
    border-radius: 8px;
    color: #e8e8f0;
    font-size: 1rem;
    outline: none;
    margin-bottom: 18px;
    transition: border-color 0.2s;
  }
  input[type=password]:focus { border-color: #f97316; }
  button {
    width: 100%;
    padding: 12px;
    background: #f97316;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  .erro {
    background: #2a1a1a;
    border: 1px solid #5a2a2a;
    color: #ef4444;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.85rem;
  }
  .voltar { display: block; margin-top: 16px; color: #7a7a9a; font-size: 0.82rem; text-decoration: none; }
  .voltar:hover { color: #e8e8f0; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔒</div>
  <h1>MEU CARRO</h1>
  <p class="sub">Digite a senha para editar registros</p>

  {% with msgs = get_flashed_messages() %}
    {% if msgs %}
      <div class="erro">❌ {{ msgs[0] }}</div>
    {% endif %}
  {% endwith %}

  <form method="POST">
    <label>Senha</label>
    <input type="password" name="senha" autofocus placeholder="••••••••">
    <button type="submit">Entrar</button>
  </form>

  <a href="/" class="voltar">← Voltar sem login (só visualizar)</a>
</div>
</body>
</html>
